<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="/css/style.css">
    <title th:text="${group.name}">Group</title>
</head>
<body>
<h1 th:text="${group.name}">Group name</h1>
<p>Share this link with your group:</p>
<p><code th:text="'/g/' + ${group.inviteToken}">/g/token</code></p>
<div th:if="${isOrganizer}">
    <p>Your organizer link. Keep it private: it's the only way to add trips and costs.</p>
    <p><code th:text="'/g/' + ${group.inviteToken} + '?org=' + ${group.organizerToken}">/g/token?org=...</code></p>
</div>

<h2>Trips</h2>
<p th:if="${trips.isEmpty()}">No trips yet.</p>
<ul>
    <li th:each="trip : ${trips}">
        <a th:href="'/g/' + ${group.inviteToken} + '/trips/' + ${trip.id} + ${orgQuery}" th:text="${trip.name}">Trip name</a>:
        <span th:text="${trip.startDate}">start</span> to <span th:text="${trip.endDate}">end</span>,
        need <span th:text="${trip.targetSize}">0</span> people,
        commit by <span th:text="${trip.commitDeadline}">deadline</span>
        <strong th:attr="data-trip-id=${trip.id}"></strong>
    </li>
</ul>
<button id="refresh" th:attr="data-token=${group.inviteToken}">Refresh who's in</button>
<script>
    document.getElementById("refresh").addEventListener("click", async () => {
      const token = document.getElementById("refresh").dataset.token;
      const res = await fetch("/api/groups/" + token + "/trips");
      const trips = await res.json();
      for (const trip of trips) {
        const spot = document.querySelector('[data-trip-id="' + trip.id + '"]');
        spot.textContent = trip.peopleIn + "/" + trip.targetSize;
      }
    });
</script>
<h2 th:if="${isOrganizer}">Add a trip</h2>
<form th:if="${isOrganizer}" th:action="'/g/' + ${group.inviteToken} + '/trips'" method="post">
    <input type="hidden" name="org" th:value="${group.organizerToken}">
    <label for="name">Trip name</label>
    <input id="name" name="name" type="text" required maxlength="50">
    <label for="startDate">Start date</label>
    <input id="startDate" name="startDate" type="date" required>
    <label for="endDate">End date</label>
    <input id="endDate" name="endDate" type="date" required>
    <label for="targetSize">How many people</label>
    <input id="targetSize" name="targetSize" type="number" min="1" required>
    <label for="commitDeadline">Commit by</label>
    <input id="commitDeadline" name="commitDeadline" type="date" required>
    <button type="submit">Add trip</button>
</form>

<a class="back" href="/">Back to home</a>
</body>
</html>
