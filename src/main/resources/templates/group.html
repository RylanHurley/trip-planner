<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="/css/style.css">
    <title th:text="${group.name}">Group</title>
</head>
<body>
<header class="brand"><a href="/">Trip Planner</a></header>
<h1 th:text="${group.name}">Group name</h1>

<div class="card">
    <strong>Share this link with your group</strong>
    <div class="link-row">
        <code class="full-link" th:text="'/g/' + ${group.inviteToken}">/g/token</code>
        <button type="button" class="copy-link secondary">Copy link</button>
    </div>
</div>
<details class="card" th:if="${isOrganizer}">
    <summary>Your organizer link (keep it private)</summary>
    <p class="small muted">It's the only way to add trips and costs, and it can't be recovered. Don't share it.</p>
    <div class="link-row">
        <code class="full-link" th:text="'/g/' + ${group.inviteToken} + '?org=' + ${group.organizerToken}">/g/token?org=...</code>
        <button type="button" class="copy-link secondary">Copy link</button>
    </div>
</details>

<h2>Trips</h2>
<p class="muted" th:if="${trips.isEmpty()}">No trips yet.</p>
<ul>
    <li th:each="trip : ${trips}">
        <div class="trip-row">
            <a class="trip-name" th:href="'/g/' + ${group.inviteToken} + '/trips/' + ${trip.id} + ${orgQuery}" th:text="${trip.name}">Trip name</a>
            <strong class="count" th:attr="data-trip-id=${trip.id}"></strong>
        </div>
        <p class="small muted">
            <span th:text="${#temporals.format(trip.startDate, 'MMM d')}">start</span> to
            <span th:text="${#temporals.format(trip.endDate, 'MMM d, yyyy')}">end</span>,
            commit by <span th:text="${#temporals.format(trip.commitDeadline, 'MMM d')}">deadline</span>
        </p>
    </li>
</ul>
<button id="refresh" class="secondary" th:attr="data-token=${group.inviteToken}">Refresh who's in</button>
<script>
    document.getElementById("refresh").addEventListener("click", async () => {
      const token = document.getElementById("refresh").dataset.token;
      const res = await fetch("/api/groups/" + token + "/trips");
      const trips = await res.json();
      for (const trip of trips) {
        const spot = document.querySelector('[data-trip-id="' + trip.id + '"]');
        spot.textContent = trip.peopleIn + "/" + trip.targetSize;
      }
    });
    document.getElementById("refresh").click();
</script>
<script>
    document.querySelectorAll(".full-link").forEach((code) => {
      code.textContent = window.location.origin + code.textContent;
      code.parentElement.querySelector(".copy-link").addEventListener("click", async (event) => {
        await navigator.clipboard.writeText(code.textContent);
        event.target.textContent = "Copied!";
      });
    });
</script>

<h2 th:if="${isOrganizer}">Add a trip</h2>
<form th:if="${isOrganizer}" th:action="'/g/' + ${group.inviteToken} + '/trips'" method="post">
    <input type="hidden" name="org" th:value="${group.organizerToken}">
    <label for="name">Trip name</label>
    <input id="name" name="name" type="text" required maxlength="50">
    <label for="startDate">Start date</label>
    <input id="startDate" name="startDate" type="date" required>
    <label for="endDate">End date</label>
    <input id="endDate" name="endDate" type="date" required>
    <label for="targetSize">How many people</label>
    <input id="targetSize" name="targetSize" type="number" min="1" required>
    <label for="commitDeadline">Commit by</label>
    <input id="commitDeadline" name="commitDeadline" type="date" required>
    <button type="submit">Add trip</button>
</form>
</body>
</html>
